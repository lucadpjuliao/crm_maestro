<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maestro CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --lane:#FFFFFF; --ink:#1A2540; --muted:#6B7A96; --line:#E3E9F3;
  --bar:#1F55B3; --bar-ink:#FFFFFF; --bar-muted:#D3E2F8;
  --navy:#1D4693; --blue:#2F6BC2; --sky:#5E9EDF; --wash:#EAF2FC; --badge:#1D4693;
  --s1-bg:#E4F0FC; --s1-fg:#2F6BC2;
  --s2-bg:#DCEBFB; --s2-fg:#1F5DB5;
  --s3-bg:#FFF3D6; --s3-fg:#B07A0C;
  --s4-bg:#DDF4E7; --s4-fg:#1D8150;
  --s5-bg:#FCE4E4; --s5-fg:#C23A3A;
  --shadow:0 1px 2px rgba(20,43,92,.06),0 2px 8px rgba(20,43,92,.05);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root.tema-escuro{
    --bg:#0E1730; --surface:#17233F; --lane:#121D37; --ink:#E8EEF9; --muted:#9DADCB; --line:#25345A;
    --bar:#0A1229; --bar-ink:#FFFFFF; --bar-muted:#8EA3CC;
    --navy:#8DB8F2; --blue:#6EA6EC; --sky:#7FB4EC; --wash:#1C2C52; --badge:#3D6FC0;
    --s1-bg:#1D3258; --s1-fg:#8DB8F2; --s2-bg:#1B3560; --s2-fg:#7FB0F0;
    --s3-bg:#3A3018; --s3-fg:#F0C35A; --s4-bg:#16382A; --s4-fg:#6AD39B; --s5-bg:#3D1E24; --s5-fg:#F28A8A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root.tema-escuro{
  --bg:#0E1730; --surface:#17233F; --lane:#121D37; --ink:#E8EEF9; --muted:#9DADCB; --line:#25345A;
  --bar:#0A1229; --bar-ink:#FFFFFF; --bar-muted:#8EA3CC;
  --navy:#8DB8F2; --blue:#6EA6EC; --sky:#7FB4EC; --wash:#1C2C52; --badge:#3D6FC0;
  --s1-bg:#1D3258; --s1-fg:#8DB8F2; --s2-bg:#1B3560; --s2-fg:#7FB0F0;
  --s3-bg:#3A3018; --s3-fg:#F0C35A; --s4-bg:#16382A; --s4-fg:#6AD39B; --s5-bg:#3D1E24; --s5-fg:#F28A8A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* barra superior */
.topbar{flex:none;display:flex;align-items:center;gap:6px;height:62px;padding:0 20px;background:var(--bar);color:var(--bar-ink)}
.logo{display:flex;align-items:center;gap:10px;margin-right:22px}
.logo .tile{display:grid;place-items:center;background:none}
.logo img{width:46px;height:auto;filter:brightness(0) invert(1)}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.01em}
.nav{display:flex;height:100%}
.nav button{display:flex;align-items:center;gap:8px;height:100%;padding:0 14px;border:0;background:none;color:var(--bar-muted);font-weight:700;cursor:pointer;border-bottom:3px solid transparent;border-top:3px solid transparent}
.nav button:hover{color:var(--bar-ink)}
.nav button[aria-current="page"]{color:var(--bar-ink);border-bottom-color:#FFFFFF}
.gsearch{margin-left:auto;position:relative}
.gsearch input{width:260px;padding:9px 34px 9px 12px;border:0;border-radius:4px;background:#fff;color:#1A2540}
.gsearch input::placeholder{color:#8A97AD}
.gsearch svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#8A97AD}

/* cabeçalho da página */
.pagehead{flex:none;display:flex;align-items:center;gap:14px;padding:18px 24px 12px;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
.badge{background:var(--badge);color:#fff;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:3px}
.kpis{display:flex;gap:18px;color:var(--muted);font-size:13.5px;margin-left:8px}
.kpis b{color:var(--ink)}
.toolbar{flex:none;display:flex;align-items:center;gap:10px;padding:0 24px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.field{position:relative}
.field svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field input{width:440px;max-width:100%;padding:11px 12px 11px 36px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-weight:700;cursor:pointer;color:var(--ink)}
.tbtn.link{border-color:transparent;background:none;color:var(--blue)}
.primary{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:10px 18px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;margin-left:auto;padding:0;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--blue);cursor:pointer}
.iconbtn:hover{background:var(--wash);border-color:var(--sky)}
.notice{flex:none;margin:10px 24px 0;padding:9px 14px;border-radius:4px;background:var(--wash);color:var(--muted);font-size:13.5px;display:none}

/* funil */
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:16px 24px 18px}
.lane{display:flex;flex-direction:column;min-height:0;background:var(--lane);border:1px solid var(--line);border-radius:4px}
.lane.over{outline:2px dashed var(--sky);outline-offset:-2px}
.lane-head{flex:none;padding:12px 12px 10px;border-top:3px solid var(--fg);border-radius:4px 4px 0 0}
.lane-head h2{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.lane-ico{flex:none;width:28px;height:28px;border-radius:3px;display:grid;place-items:center;background:var(--bgc);color:var(--fg)}
.lane-head p{margin:4px 0 0 36px;font-size:13px;color:var(--muted)}
.cards{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:4px}

.card{flex:none;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:4px;padding:12px 12px 12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);text-align:left;width:100%}
.card:hover{border-color:var(--sky)}
.card.dragging{opacity:.45}
.card .info{flex:1;min-width:0}
.card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.card .sub{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.card .meta a{color:var(--blue);text-decoration:none;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta a:hover{text-decoration:underline}
.card .meta span{color:var(--muted)}
.chip{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bgc);color:var(--fg)}

/* lista */
.list{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px;display:none}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--wash)}
td a{color:var(--blue);text-decoration:none;font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:3px;font-size:12.5px;font-weight:700;background:var(--bgc);color:var(--fg)}

/* modal */
dialog{border:0;border-radius:6px;padding:0;width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(10,18,41,.35)}
dialog.wide{width:min(1020px,calc(100vw - 32px))}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
dialog::backdrop{background:rgba(10,18,41,.55)}

.mhead{position:relative;display:flex;align-items:center;gap:14px;padding:20px 22px;background:var(--bar);color:#fff;overflow:hidden}
.mhead::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.06);pointer-events:none}
.avatar{flex:none;width:52px;height:52px;border-radius:4px;background:#fff;color:var(--bar);display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.htext{flex:1;min-width:0;position:relative;z-index:1}
.htext h2{margin:0;font-size:21px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htext p{margin:3px 0 0;font-size:13.5px;color:#D3E2F8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:3px 9px;border-radius:3px;background:#fff;color:var(--fg);font-size:12.5px;font-weight:800}
.hacts{display:flex;gap:8px;position:relative;z-index:1}
.hact{width:40px;height:40px;border-radius:3px;display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);cursor:pointer;text-decoration:none}
.hact:hover{background:rgba(255,255,255,.26)}
.hact.ghost{background:transparent;border-color:transparent}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 22px;border-bottom:1px solid var(--line);background:#F7F9FD}
.step{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 6px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.step:hover{border-color:var(--fg);color:var(--fg)}
.step.done{background:var(--bgc);color:var(--fg);border-color:transparent}
.step.on{background:var(--fg);color:#fff;border-color:var(--fg);box-shadow:0 3px 10px rgba(20,43,92,.2)}

.mgrid{display:grid;grid-template-columns:1fr}
dialog.wide .mgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
form{padding:20px 22px 22px}
.sec{display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:14px;font-weight:800;color:var(--navy)}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec+label,.sec+.grid2{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:14px}
.inp{position:relative;display:block;margin-top:6px}
.inp svg{position:absolute;left:12px;top:13px;color:var(--sky);pointer-events:none}
.inp input,.inp textarea{display:block;width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:4px;background:#FBFCFE;font-size:15px;color:var(--ink);font-weight:400;transition:border-color .15s,box-shadow .15s}
.inp textarea{min-height:92px;resize:vertical;line-height:1.45}
.inp input:focus,.inp textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--wash);background:#fff}
.dates{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.dates span{display:inline-flex;align-items:center;gap:6px}
.dates svg{color:var(--sky)}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.actions .del{margin-right:auto;color:var(--s5-fg);display:inline-flex;align-items:center;gap:6px}
.actions .del:hover{background:var(--s5-bg);border-color:transparent}
.err{color:var(--s5-fg);font-size:13px;min-height:18px}

.chat{display:none;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
dialog.wide .chat{display:flex}
.chat-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.chat-ico{flex:none;width:36px;height:36px;border-radius:3px;display:grid;place-items:center;background:var(--wash);color:var(--blue)}
.chat-head h3{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
.chat-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ncount{margin-left:auto;padding:2px 8px;border-radius:3px;background:var(--wash);color:var(--blue);font-size:12.5px;font-weight:800}
.msgs{flex:1;height:440px;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:#F7F9FD;background-image:radial-gradient(#E3EAF5 1px,transparent 1px);background-size:18px 18px}
.msg{max-width:85%;align-self:flex-start}
.msg.me{align-self:flex-end}
.bubble{padding:9px 12px;border-radius:4px 4px 4px 0;background:#FFFFFF;border:1px solid var(--line);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;box-shadow:0 1px 2px rgba(20,43,92,.05)}
.msg.me .bubble{border-radius:4px 4px 0 4px;background:var(--blue);border-color:var(--blue);color:#fff}
.when{font-size:12px;color:var(--muted);margin-top:4px}
.msg.me .when{text-align:right}
.sys{align-self:center;display:inline-flex;align-items:center;gap:6px;text-align:center;font-size:12.5px;color:var(--muted);background:#FFFFFF;border:1px solid var(--line);padding:4px 10px;border-radius:3px}
.composer{display:flex;gap:8px;padding:12px 20px 20px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;height:44px;padding:11px 12px;border:1px solid var(--line);border-radius:4px;background:#FBFCFE;font-size:14.5px}
.composer textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--wash)}
.composer button{flex:none;width:44px;height:44px;border:0;border-radius:3px;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:default}

.sys i,.dates i{font-style:normal}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}.inp input,.inp textarea{transition:none}}

@media (max-width:900px){
  .gsearch{display:none}
  .kpis{display:none}
}
@media (max-width:640px){
  .topbar{padding:0 12px}.logo{margin-right:8px}.logo b{display:none}
  .nav button{padding:0 10px}
  .pagehead,.toolbar{padding-left:16px;padding-right:16px}
  .field{flex:1}.field input{width:100%}
  .primary{margin-left:0}
  .board{padding:12px 16px 14px;grid-template-columns:repeat(5,calc(100vw - 32px));overflow-x:auto;scroll-snap-type:x mandatory}
  .lane{scroll-snap-align:start}
  .list{padding:12px 16px}
  .grid2{grid-template-columns:1fr}
  dialog.wide .mgrid{grid-template-columns:1fr}
  .chat{border-left:0;border-top:1px solid var(--line)}
  .msgs{height:320px}
  .step span{display:none}
  .steps{padding:12px 16px}
  .mhead{padding:16px}
  .hacts .hact:not(.ghost){display:none}
  form{padding:18px 16px}
}
</style>
</head>

      <label>Telefone<span class="inp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><input name="telefone" type="tel" maxlength="30" placeholder="(11) 99999-9999"></span></label>
      <label>Instagram / Facebook<span class="inp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg><input name="social" maxlength="200" placeholder="@escola ou link"></span></label>
    </div>
    <h3 class="sec">Negociação</h3>
    <label>Detalhes da negociação<span class="inp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><textarea name="obs" maxlength="2000" placeholder="Plano de interesse, valores, prazos"></textarea></span></label>
    <div class="dates" id="dates"></div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="tbtn del" id="delBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Excluir</button>
      <button type="button" class="tbtn" id="cancelBtn">Cancelar</button>
      <button type="submit" class="primary" style="margin-left:0" id="saveBtn">Salvar lead</button>
    </div>
  </form>
  <aside class="chat" id="chat">
    <div class="chat-head"><span class="chat-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span><div><h3>Histórico da negociação</h3><p>Registre cada interação com a escola.</p></div><span class="ncount" id="ncount">0</span></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composer">
      <textarea id="msgIn" maxlength="2000" placeholder="Escreva uma observação" aria-label="Nova observação"></textarea>
      <button type="button" id="sendBtn" title="Enviar" aria-label="Enviar observação"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </aside>
 </div>
</dialog>

<script>
const IC={
  star:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  deal:'<path d="M4 7h16v10H4z"/><path d="M8 12h.01M12 12a2 2 0 1 0 0-.01M16 12h.01"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  x:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>'
};
const STAGES=[
  {id:"inicial",name:"Inicial",n:1,icon:"star"},
  {id:"contato",name:"Em contato",n:2,icon:"phone"},
  {id:"negociacao",name:"Negociação",n:3,icon:"deal"},
  {id:"convertido",name:"Convertido",n:4,icon:"check"},
  {id:"perdido",name:"Perdido",n:5,icon:"x"}
];
const stageOf=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const svg=(k,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

let DB=null, USER=null, me=null, unsubNotes=null, notes=[], noteTok=0;
let leads=[], editingId=null, col=null, query="", sortMode="recent", view="funil";
const $=s=>document.querySelector(s);
const board=$("#board"), dlg=$("#dlg"), form=$("#form");

// armazenamento
const LS="maestro-crm-leads";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(leads))}catch(e){}}
function notice(t){const n=$("#notice");n.textContent=t||"";n.style.display=t?"block":"none"}
leads=lsLoad();

(async()=>{
  let db=null;
  try{db=window.claude&&await window.claude.use("db")}catch(e){}
  try{USER=window.claude&&await window.claude.use("user");if(USER)me=await USER.id()}catch(e){}
  if(!db){notice("Os leads ficam salvos apenas neste navegador.");return}
  DB=db; col=db.collection("leads");
  const t=setTimeout(()=>notice("Não foi possível carregar os leads ainda. Verifique sua conexão."),10000);
  col.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(t);notice("")}
    leads=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },()=>{clearTimeout(t);col=null;notice("Os leads não puderam ser sincronizados. Alterações ficam salvas apenas neste navegador.");leads=lsLoad();render()});
})();

async function saveLead(lead){
  if(col){
    try{await col.doc(lead.id).set(lead);return true}
    catch(e){alert(e&&e.code==="quota_exceeded"?"Limite de leads atingido. Exclua leads antigos para criar novos.":"Não foi possível salvar o lead. Tente de novo.");return false}
  }
  const i=leads.findIndex(l=>l.id===lead.id); if(i>=0)leads[i]=lead; else leads.push(lead);
  lsSave(); render(); return true;
}
async function removeLead(id){
  const nc=notesCol(id);
  if(nc){try{const s=await nc.get();for(const d of s.docs)await nc.doc(d.id).delete()}catch(e){}}
  if(col){try{await col.doc(id).delete()}catch(e){alert("Não foi possível excluir o lead.")}return}
  leads=leads.filter(l=>l.id!==id); lsSave(); render();
}
const newId=()=>"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// utilidades
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e}
function socialUrl(s){s=(s||"").trim();if(!s)return null;if(/^https?:\/\//i.test(s))return s;if(/^(www\.)?(instagram|facebook|fb)\.com/i.test(s))return "https://"+s;if(s.startsWith("@"))return "https://instagram.com/"+encodeURIComponent(s.slice(1));return null}
function waUrl(t){let d=(t||"").replace(/\D/g,"");if(!d)return null;if(d.length<=11)d="55"+d;return "https://wa.me/"+d}
function link(text,url,title){const a=el(url?"a":"span",url?{href:url,target:"_blank",rel:"noopener",title:title||""}:{});a.textContent=text;a.addEventListener("click",e=>e.stopPropagation());return a}
const plural=n=>n===1?"1 lead":n+" leads";

function filtered(){
  const q=query.toLowerCase();
  const v=leads.filter(l=>!q||[l.escola,l.responsavel,l.telefone,l.social].some(x=>(x||"").toLowerCase().includes(q)));
  return v.sort(sortMode==="az"?(a,b)=>(a.escola||"").localeCompare(b.escola||"","pt-BR"):(a,b)=>(b.updated||0)-(a.updated||0));
}

function render(){
  const tot=leads.length, conv=leads.filter(l=>l.etapa==="convertido").length, perd=leads.filter(l=>l.etapa==="perdido").length;
  const fech=conv+perd;
  $("#total").textContent=plural(tot);
  $("#kpis").innerHTML=`<span><b>${tot-fech}</b> em andamento</span><span><b>${conv}</b> convertidos</span><span><b>${fech?Math.round(conv/fech*100):0}%</b> de conversão</span>`;
  const vis=filtered();
  view==="funil"?renderBoard(vis):renderList(vis);
}

function renderBoard(vis){
  board.innerHTML="";
  for(const st of STAGES){
    const items=vis.filter(l=>stageOf(l.etapa).id===st.id);
    const lane=el("section",{class:"lane",style:`--fg:var(--s${st.n}-fg);--bgc:var(--s${st.n}-bg)`});
    const h=el("div",{class:"lane-head"});
    const h2=el("h2");const ico=el("span",{class:"lane-ico","aria-hidden":"true"},svg(st.icon,16));const nm=el("span");nm.textContent=st.name;h2.append(ico,nm);
    const p=el("p");p.textContent=plural(items.length);
    h.append(h2,p);
    const list=el("div",{class:"cards"});
    if(!items.length)list.append(el("div",{class:"empty"},query?"Nenhum resultado":"Arraste um lead para cá"));
    for(const l of items)list.append(card(l,st));
    lane.append(h,list);
    lane.addEventListener("dragover",e=>{e.preventDefault();lane.classList.add("over")});
    lane.addEventListener("dragleave",e=>{if(!lane.contains(e.relatedTarget))lane.classList.remove("over")});
    lane.addEventListener("drop",e=>{e.preventDefault();lane.classList.remove("over");moveTo(e.dataTransfer.getData("text/plain"),st.id)});
    board.append(lane);
  }
}
function card(l,st){
  const d=el("article",{class:"card",draggable:"true",tabindex:"0",role:"button","aria-label":"Abrir "+(l.escola||"lead")});
  const info=el("div",{class:"info"});
  const h=el("h3");h.textContent=l.escola||"Sem nome";info.append(h);
  if(l.responsavel){const s=el("div",{class:"sub"});s.textContent=l.responsavel;info.append(s)}
  if(l.telefone||l.social){
    const m=el("div",{class:"meta"});
    if(l.telefone)m.append(link(l.telefone,waUrl(l.telefone),"Abrir no WhatsApp"));
    if(l.social)m.append(link(l.social,socialUrl(l.social)));
    info.append(m);
  }
  d.append(info,el("span",{class:"chip",title:st.name},svg(st.icon)));
  d.addEventListener("click",()=>openForm(l));
  d.addEventListener("keydown",e=>{if(e.key==="Enter")openForm(l)});
  d.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",l.id);d.classList.add("dragging")});
  d.addEventListener("dragend",()=>d.classList.remove("dragging"));
  return d;
}
function renderList(vis){
  const tb=$("#tbody");tb.innerHTML="";
  if(!vis.length){const tr=el("tr");const td=el("td",{colspan:"5",style:"color:var(--muted);text-align:center;padding:28px"});td.textContent=query?"Nenhum resultado":"Nenhum lead ainda. Clique em Adicionar lead para começar.";tr.append(td);tb.append(tr);return}
  for(const l of vis){
    const st=stageOf(l.etapa);
    const tr=el("tr");
    const c1=el("td");c1.innerHTML="<b></b>";c1.firstChild.textContent=l.escola||"Sem nome";
    const c2=el("td");c2.textContent=l.responsavel||"";
    const c3=el("td");if(l.telefone)c3.append(link(l.telefone,waUrl(l.telefone),"Abrir no WhatsApp"));
    const c4=el("td");if(l.social)c4.append(link(l.social,socialUrl(l.social)));
    const c5=el("td");const p=el("span",{class:"pill",style:`--fg:var(--s${st.n}-fg);--bgc:var(--s${st.n}-bg)`});p.textContent=st.name;c5.append(p);
    tr.append(c1,c2,c3,c4,c5);
    tr.addEventListener("click",()=>openForm(l));
    tb.append(tr);
  }
}
async function moveTo(id,etapa){
  const l=leads.find(x=>x.id===id); if(!l||l.etapa===etapa)return;
  if(await saveLead({...l,etapa,updated:Date.now()}))addNote(id,"Etapa alterada para "+stageOf(etapa).name,"etapa");
}

// visualização
function setView(v){
  view=v;
  document.querySelectorAll(".nav button").forEach(b=>{if(b.dataset.view===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  board.style.display=v==="funil"?"":"none";
  $("#list").style.display=v==="lista"?"block":"none";
  $("#pageTitle").textContent=v==="funil"?"Funil de vendas":"Todos os leads";
  $("#q").placeholder=v==="funil"?"Buscar no funil":"Buscar na lista";
  render();
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));

// formulário
const HI={wa:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',at:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const hsvg=(p,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function initials(n){const w=(n||"").replace(/[^\p{L}\p{N} ]/gu,"").split(/\s+/).filter(x=>x.length>2||/^\p{Lu}/u.test(x));return ((w[0]||"")[0]||"")+((w[1]||"")[0]||"")}
function renderSteps(cur){
  const box=$("#steps");box.innerHTML="";
  const idx=STAGES.findIndex(s=>s.id===cur);
  STAGES.forEach((st,i)=>{
    const b=el("button",{type:"button",class:"step",role:"radio","aria-checked":String(st.id===cur),style:`--fg:var(--s${st.n}-fg);--bgc:var(--s${st.n}-bg)`},svg(st.icon,15)+"<span></span>");
    b.querySelector("span").textContent=st.name;b.title=st.name;
    if(st.id===cur)b.classList.add("on");
    else if(cur!=="perdido"&&st.id!=="perdido"&&i<idx)b.classList.add("done");
    b.addEventListener("click",()=>{$("#etapaIn").value=st.id;renderSteps(st.id);updateHead()});
    box.append(b);
  });
}
function updateHead(){
  const name=form.elements.escola.value.trim(), resp=form.elements.responsavel.value.trim();
  $("#hName").textContent=name||(editingId?"Sem nome":"Novo lead");
  const ini=initials(name).toUpperCase();
  $("#hAvatar").innerHTML=ini?"":hsvg('<path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-5h6v5"/><path d="M12 9v.01"/>',24); if(ini)$("#hAvatar").textContent=ini;
  $("#hSub").textContent=resp?("Responsável: "+resp):(editingId?"Responsável não informado":"Preencha os dados da escola");
  const st=stageOf($("#etapaIn").value);
  const pill=$("#hPill");pill.innerHTML="";
  const sp=el("span",{class:"hpill",style:`--fg:var(--s${st.n}-fg)`},svg(st.icon,13)+"<b></b>");sp.querySelector("b").textContent=st.name;pill.append(sp);
  const links=$("#hLinks");links.innerHTML="";
  const wa=waUrl(form.elements.telefone.value), so=socialUrl(form.elements.social.value);
  if(wa){const a=el("a",{class:"hact",href:wa,target:"_blank",rel:"noopener",title:"Conversar no WhatsApp","aria-label":"Conversar no WhatsApp"},hsvg(HI.wa));links.append(a)}
  if(so){const a=el("a",{class:"hact",href:so,target:"_blank",rel:"noopener",title:"Abrir rede social","aria-label":"Abrir rede social"},hsvg(HI.at));links.append(a)}
}
["escola","responsavel","telefone","social"].forEach(k=>form.elements[k].addEventListener("input",updateHead));
function openForm(l){
  editingId=l?l.id:null; form.reset(); $("#err").textContent="";
  $("#delBtn").style.display=l?"":"none";
  $("#saveBtn").textContent=l?"Salvar alterações":"Criar lead";
  const v=l||{etapa:"inicial"};
  for(const k of ["escola","responsavel","telefone","social","obs"])form.elements[k].value=v[k]||"";
  $("#etapaIn").value=stageOf(v.etapa).id;
  renderSteps($("#etapaIn").value); updateHead();
  const dt=$("#dates");dt.innerHTML="";
  if(l&&l.created){const a=el("span",{},hsvg(HI.cal,14)+"<i></i>");a.querySelector("i").textContent="Criado em "+fmt(l.created);dt.append(a)}
  if(l&&l.updated){const a=el("span",{},hsvg(HI.clock,14)+"<i></i>");a.querySelector("i").textContent="Atualizado em "+fmt(l.updated);dt.append(a)}
  dt.style.display=dt.children.length?"":"none";
  dlg.classList.toggle("wide",!!l);
  if(l)openChat(l); else closeChat();
  if(!dlg.open)dlg.showModal();
  (l?$("#msgIn"):form.elements.escola).focus();
}
$("#newBtn").addEventListener("click",()=>openForm(null));
$("#cancelBtn").addEventListener("click",()=>dlg.close());
$("#xBtn").addEventListener("click",()=>dlg.close());
$("#delBtn").addEventListener("click",async()=>{
  if(!editingId||!confirm("Excluir este lead? Essa ação não pode ser desfeita."))return;
  await removeLead(editingId); dlg.close();
});
form.addEventListener("submit",async e=>{
  e.preventDefault();
  const fd=Object.fromEntries(new FormData(form));
  for(const k in fd)fd[k]=String(fd[k]).trim();
  if(!fd.escola){$("#err").textContent="Informe o nome da escola.";return}
  const old=leads.find(l=>l.id===editingId);
  const lead={...(old||{}),...fd,id:editingId||newId(),created:old?.created||Date.now(),updated:Date.now()};
  if(!await saveLead(lead))return;
  if(old&&old.etapa!==lead.etapa)addNote(lead.id,"Etapa alterada para "+stageOf(lead.etapa).name,"etapa");
  if(old)dlg.close(); else openForm(lead);
});

// histórico (chat)
function notesCol(id){return DB&&col?DB.collection("leads/"+id+"/notas"):null}
function closeChat(){if(unsubNotes){unsubNotes();unsubNotes=null}notes=[]}
function openChat(l){
  closeChat(); renderNotes();
  const c=notesCol(l.id);
  if(c){unsubNotes=c.orderBy("ts").onSnapshot(s=>{notes=s.docs.map(d=>({id:d.id,...d.data()}));renderNotes()},()=>{})}
  else{notes=(leads.find(x=>x.id===l.id)||l).notas||[];renderNotes()}
}
dlg.addEventListener("close",closeChat);
async function addNote(leadId,texto,tipo){
  const n={texto,tipo:tipo||"nota",ts:Date.now(),autor:me||null};
  const c=notesCol(leadId);
  if(c){
    try{await c.add(n);return true}
    catch(e){alert(e&&e.code==="quota_exceeded"?"Limite de armazenamento atingido. Exclua leads antigos para liberar espaço.":"Não foi possível salvar a observação. Tente de novo.");return false}
  }
  const l=leads.find(x=>x.id===leadId); if(!l)return false;
  l.notas=[...(l.notas||[]),n]; lsSave();
  if(editingId===leadId){notes=l.notas;renderNotes()}
  return true;
}
const fmt=ts=>{const d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"})+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};
async function renderNotes(){
  const tok=++noteTok, box=$("#msgs");
  const names={}, ids=[...new Set(notes.map(n=>n.autor).filter(a=>a&&a!==me))];
  if(USER&&ids.length){try{const ps=await USER.profiles(ids);for(const id of ids)names[id]=(ps[id]&&ps[id].name)||""}catch(e){}}
  if(tok!==noteTok)return;
  box.innerHTML="";
  $("#ncount").textContent=notes.filter(n=>n.tipo!=="etapa").length;
  if(!notes.length){const s=el("div",{class:"sys"});s.textContent="Nenhuma observação ainda. Escreva a primeira abaixo.";box.append(s);return}
  for(const n of notes){
    if(n.tipo==="etapa"){const s=el("div",{class:"sys"},svg("deal",13)+"<i></i>");s.querySelector("i").textContent=n.texto+", "+fmt(n.ts);box.append(s);continue}
    const mine=!n.autor||n.autor===me;
    const m=el("div",{class:"msg"+(mine?" me":"")});
    const b=el("div",{class:"bubble"});b.textContent=n.texto;
    const w=el("div",{class:"when"});w.textContent=(mine?"Você":(names[n.autor]||"Alguém da equipe"))+", "+fmt(n.ts);
    m.append(b,w);box.append(m);
  }
  box.scrollTop=box.scrollHeight;
}
async function sendNote(){
  const t=$("#msgIn").value.trim(); if(!t||!editingId)return;
  const btn=$("#sendBtn"); btn.disabled=true;
  if(await addNote(editingId,t,"nota"))$("#msgIn").value="";
  btn.disabled=false; $("#msgIn").focus();
}
$("#sendBtn").addEventListener("click",sendNote);
$("#msgIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendNote()}});

// busca e ordenação
function setQuery(v){query=v;$("#q").value=v;$("#q2").value=v;render()}
$("#q").addEventListener("input",e=>setQuery(e.target.value));
$("#q2").addEventListener("input",e=>setQuery(e.target.value));
$("#sortBtn").addEventListener("click",()=>{sortMode=sortMode==="recent"?"az":"recent";$("#sortLbl").textContent=sortMode==="az"?"Nome A–Z":"Mais recentes";render()});

render();
</script>
</body>
</html>
